{% extends "base.html" %}

{% block content %}

<div class="card shadow">

<div class="card-body">

<h2>Prediction History</h2>

<table class="table table-striped">

<thead>

<tr>

<th>Date</th>
<th>Image</th>
<th>Class</th>
<th>Confidence</th>

</tr>

</thead>

<tbody>

{% for row in history %}

<tr>

<td>{{ row.Date }}</td>

<td>{{ row.Image }}</td>

<td>{{ row.Class }}</td>

<td>{{ row.Confidence }}%</td>

</tr>

{% endfor %}

</tbody>

</table>

<a href="/" class="btn btn-primary">
Back
</a>

</div>

</div>

{% endblock %}
